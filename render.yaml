services:
  - type: web
    name: aris-whatsapp-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_NAME
        value: aris_db
      - key: API_VERSION
        value: v25.0
      - key: MONGODB_URI
        sync: false
      - key: ACCESS_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: VERIFY_TOKEN
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@aris.ai
      - key: ADMIN_PASSWORD
        sync: false
