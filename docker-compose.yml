version: '3.8'

services:
  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: aris_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./storage/qdrant:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  # MongoDB Document Database
  mongodb:
    image: mongo:7.0
    container_name: aris_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ./storage/mongodb_data:/data/db

volumes:
  mongodb_data:
